name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Lint, Typecheck, Test, and Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres-shadow:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: rota_shadow
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_root_secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Check for committed secrets (GIT-1)
        shell: bash
        run: |
          if git grep -E "(FLWSECK|FLWPUBK|-----BEGIN)" -- ':!.env.example' ':!docs/Rota-PRD-v1.1.md' ':!.agents/**' ':!apps/api/lib/config/env.ts' ':!.github/workflows/ci.yml'; then
            echo "ERROR: Potential secret detected in tracked files (GIT-1)."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run linter and formatter check
        run: pnpm lint

      - name: Typecheck all workspaces
        run: pnpm typecheck

      - name: Run Vitest unit tests
        run: pnpm test

      - name: Validate Prisma schema
        run: pnpm --filter api exec prisma validate

      - name: Build Next.js API
        run: pnpm --filter api build
