[databases]
s0_primary = host=pg-s0-primary port=5432 dbname=rota_s0 auth_user=rota_owner
s0_replica = host=pg-s0-replica port=5432 dbname=rota_s0 auth_user=rota_owner
s1_primary = host=pg-s1-primary port=5432 dbname=rota_s1 auth_user=rota_owner
s1_replica = host=pg-s1-replica port=5432 dbname=rota_s1 auth_user=rota_owner

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

pool_mode = transaction
max_client_conn = 1000
default_pool_size = 20
reserve_pool_size = 5
reserve_pool_timeout = 3
server_idle_timeout = 60
query_wait_timeout = 10

# Disable server connection resets in transaction pool mode to prevent session state reliance
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits

